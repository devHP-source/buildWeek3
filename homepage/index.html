<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../assets/img/Spotify_logo-favicon.svg" />
    <title>Spotify Clone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
   
    <header class="top-navbar">
      <nav class="navbar-content">
        <div class="navbar-left">
          <a href="./index.html" class="spotify-logo">
            <i class="bi bi-spotify"></i>
          </a>
        </div>

        <div class="navbar-center">
          <a href="./index.html" class="home-button">
            <i class="bi bi-house-door-fill"></i>
          </a>

          <div class="search-container">
            <i class="bi bi-search"></i>
            <input
              type="search"
              id="search-input"
              placeholder="Cosa vuoi ascoltare?"/>
          </div>
        </div>

        <div class="navbar-right">
          <a href="#" class="navbar-link">Premium</a>
          <a href="#" class="navbar-link">Assistenza</a>
          <a href="#" class="navbar-link">Scarica</a>

          <button class="signup-button">Iscriviti</button>
          <button class="login-button">Accedi</button>
        </div>
      </nav>
    </header>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">
            <i class="bi bi-collection"></i>
            La tua libreria
          </h2>

          <button class="sidebar-add-button">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>

        <div class="sidebar-actions">
          <button class="sidebar-pill">Playlist</button>
          <button class="sidebar-pill">Artisti</button>
          <button class="sidebar-pill">Album</button>
        </div>

        <div class="sidebar-search">
          <button class="sidebar-search-button">
            <i class="bi bi-search"></i>
          </button>

          <button class="sidebar-order-button">
            Recenti
            <i class="bi bi-list-ul"></i>
          </button>
        </div>

        <div class="library-list">
          <div class="library-item">
            <div class="library-placeholder">
              <i class="bi bi-music-note-beamed"></i>
            </div>

            <div class="library-item-info">
              <h3>Brani che ti piacciono</h3>
              <p>Playlist</p>
            </div>
          </div>

          <div class="library-item">
            <div class="library-placeholder">
              <i class="bi bi-person-fill"></i>
            </div>
            <div class="library-item-info">
              <h3>Artisti seguiti</h3>
              <p>Artisti</p>
            </div>
          </div>

          <div class="library-item">
            <div class="library-placeholder">
              <i class="bi bi-disc-fill"></i>
            </div>

            <div class="library-item-info">
              <h3>Album salvati</h3>
              <p>Album</p>
            </div>
          </div>
        </div>
      </aside>

      <main id="main-content" class="main-content"></main>
    </div>

    <footer class="player-bar">
      <div class="player-left">
        <img
          src="https://placehold.co/56x56"
          alt="Copertina brano"
          class="player-cover"/>

        <div class="player-song-info">
          <h4>Nome brano</h4>
          <p>Nome artista</p>
        </div>

        <button class="player-icon">
          <i class="bi bi-heart"></i>
        </button>
      </div>
      <div class="player-center">
        <div class="player-controls">
          <button class="player-icon">
            <i class="bi bi-shuffle"></i>
          </button>

          <button class="player-icon">
            <i class="bi bi-skip-start-fill"></i>
          </button>

          <button class="play-button">
            <i class="bi bi-play-fill"></i>
          </button>

          <button class="player-icon">
            <i class="bi bi-skip-end-fill"></i>
          </button>

          <button class="player-icon">
            <i class="bi bi-repeat"></i>
          </button>
        </div>

        <div class="player-progress">
          <span>0:00</span>

          <div class="progress-bar">
            <div class="progress"></div>
          </div>

          <span>3:45</span>
        </div>
      </div>
      <div class="player-right">
        <button class="player-icon">
          <i class="bi bi-mic"></i>
        </button>

        <button class="player-icon">
          <i class="bi bi-list"></i>
        </button>

        <button class="player-icon">
          <i class="bi bi-speaker"></i>
        </button>

        <button class="player-icon">
          <i class="bi bi-volume-up"></i>
        </button>

        <div class="volume-bar">
          <div class="volume-progress"></div>
        </div>
      </div>
    </footer>
    <script src="../js/main.js"></script>
  </body>
</html>
