<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/album.css">
    <title>Album</title>
</head>

<body>
    <!-- Navigazione superiore -->
    <header class="top-navbar">
        <nav class="navbar-content" aria-label="Navigazione principale">
            <div class="navbar-left">
                <a href="./index.html" class="spotify-logo" aria-label="Vai alla homepage">
                    <i class="bi bi-spotify" aria-hidden="true"></i>
                </a>
            </div>

            <div class="navbar-center">
                <a href="./index.html" class="home-button" aria-label="Vai alla homepage">
                    <i class="bi bi-house-door-fill" aria-hidden="true"></i>
                </a>

                <div class="search-container">
                    <i class="bi bi-search" aria-hidden="true"></i>

                    <input type="search" id="search-input" name="search" placeholder="Cosa vuoi ascoltare?"
                        aria-label="Cerca musica" autocomplete="off" />
                </div>
            </div>

            <div class="navbar-right">
                <a href="#" class="navbar-link">Premium</a>
                <a href="#" class="navbar-link">Assistenza</a>
                <a href="#" class="navbar-link">Scarica</a>

                <button class="signup-button" type="button">Iscriviti</button>

                <button class="login-button" type="button">Accedi</button>
            </div>
        </nav>
    </header>

    <!-- Layout principale -->
    <div class="row app-layout m-0">
        <!-- Libreria laterale -->
        <aside class="sidebar col-12 col-md-3" aria-label="La tua libreria">
            <div class="sidebar-header">
                <h2 class="sidebar-title">
                    <i class="bi bi-collection" aria-hidden="true"></i>
                    La tua libreria
                </h2>

                <button class="sidebar-add-button" type="button" aria-label="Aggiungi contenuto alla libreria">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                </button>
            </div>

            <div class="sidebar-actions">
                <button class="sidebar-pill" type="button">Playlist</button>
                <button class="sidebar-pill" type="button">Artisti</button>
                <button class="sidebar-pill" type="button">Album</button>
            </div>

            <div class="sidebar-search">
                <button class="sidebar-search-button" type="button" aria-label="Cerca nella libreria">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>

                <button class="sidebar-order-button" type="button">
                    Recenti
                    <i class="bi bi-list-ul" aria-hidden="true"></i>
                </button>
            </div>

            <div class="library-list">
                <article class="library-item">
                    <div class="library-placeholder">
                        <i class="bi bi-music-note-beamed" aria-hidden="true"></i>
                    </div>

                    <div class="library-item-info">
                        <h3>Brani che ti piacciono</h3>
                        <p>Playlist</p>
                    </div>
                </article>

                <article class="library-item">
                    <div class="library-placeholder">
                        <i class="bi bi-person-fill" aria-hidden="true"></i>
                    </div>

                    <div class="library-item-info">
                        <h3>Artisti seguiti</h3>
                        <p>Artisti</p>
                    </div>
                </article>

                <article class="library-item">
                    <div class="library-placeholder">
                        <i class="bi bi-disc-fill" aria-hidden="true"></i>
                    </div>

                    <div class="library-item-info">
                        <h3>Album salvati</h3>
                        <p>Album</p>
                    </div>
                </article>
            </div>
        </aside>



        <!-- Contenuto dinamico della homepage -->
        <main id="main-content" class="main-content col-12 col-md-9 pt-5">

            <div class="container">
                <div class="row align-items-end">
                    <div class="col-auto"><img src="" alt="" id="album-cover"></div>
                    <div class="col">
                        <small>ALBUM</small>
                        <h1 class="album-title">Gioventù Brucata</h1>
                        <div class="album-meta-container d-flex align-items-center gap-2 flex-wrap">
                            <img src="" alt="Artist Photo" id="artist-avatar" class="rounded-circle artist-img">


                            <a href="" id="album-artist"
                                class="text-white link-underline link-underline-opacity-0 hover-underline">Pinguini
                                Tattici Nucleari
                            </a>
                            <span class="meta-dot">&bull;</span>
                            <span class="album-meta d-md-inline">2017 </span>
                            <span class="meta-dot">&bull;</span>
                            <span class="album-meta d-none d-md-inline">12 brani </span>
                            <span class="album-meta text-muted d-none d-md-inline">53 min 20 sec.</span>
                        </div>
                    </div>
                </div>
                <div class="tracklist-section mt-4">
                    <div class="container mt-4">
                        <div class="row align-items-center gy-3">
                            <div class="col-auto">
                                <button class="btn play-button-main rounded-circle" type="button"
                                    aria-label="Riproduci">
                                    <i class="bi bi-play-fill fs-4"></i>
                                </button>
                            </div>
                            <div class="col-auto">
                                <i class="bi bi-heart fs-3 text-white"></i>
                            </div>
                            <div class="col-auto">
                                <i class="bi bi-arrow-down-circle fs-3"></i>
                            </div>
                            <div class="col-auto">
                                <i class="bi bi-three-dots fs-3 text-white"></i>
                            </div>
                        </div>
                    </div>


                    <!-- INTESTAZIONE TRACCE (visibile solo su Desktop) -->
                    <div class="container mt-4 d-none d-md-block text-muted border-bottom border-secondary pb-2">
                        <div class="row px-3 align-items-center small">
                            <div class="col-auto track-number">#</div>
                            <div class="col-6">TITOLO</div>
                            <div class="col-4 text-end pe-5">RIPRODUZIONI</div>
                            <div class="col text-end">
                                <i class="bi bi-clock"></i>
                            </div>
                        </div>
                    </div>

                    <!-- CONTENITORE BRANI -->
                    <div class="container mt-2">
                        <div id="tracklist-container" class="d-flex flex-column gap-2">
                        </div>
                    </div>
                </div>
        </main>
    </div>


    <!-- Player grafico statico -->
    <footer class="player-bar">
        <!-- Parte sinistra -->
        <div class="player-left">
            <img src="https://placehold.co/56x56" alt="Copertina del brano in riproduzione" class="player-cover" />

            <div class="player-song-info">
                <h4>Nome brano</h4>
                <p>Nome artista</p>
            </div>

            <button class="player-icon" type="button" aria-label="Aggiungi ai brani preferiti">
                <i class="bi bi-heart" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Parte centrale -->
        <div class="player-center">
            <div class="player-controls">
                <button class="player-icon" type="button" aria-label="Riproduzione casuale">
                    <i class="bi bi-shuffle" aria-hidden="true"></i>
                </button>

                <button class="player-icon" type="button" aria-label="Brano precedente">
                    <i class="bi bi-skip-start-fill" aria-hidden="true"></i>
                </button>

                <button class="play-button" type="button" aria-label="Riproduci">
                    <i class="bi bi-play-fill" aria-hidden="true"></i>
                </button>

                <button class="player-icon" type="button" aria-label="Brano successivo">
                    <i class="bi bi-skip-end-fill" aria-hidden="true"></i>
                </button>

                <button class="player-icon" type="button" aria-label="Ripeti">
                    <i class="bi bi-repeat" aria-hidden="true"></i>
                </button>
            </div>

            <div class="player-progress">
                <span>0:00</span>

                <div class="progress-bar" role="progressbar" aria-label="Avanzamento del brano" aria-valuemin="0"
                    aria-valuemax="100" aria-valuenow="30">
                    <div class="progress"></div>
                </div>

                <span>3:45</span>
            </div>
        </div>

        <!-- Parte destra -->
        <div class="player-right">
            <button class="player-icon" type="button" aria-label="Testo del brano">
                <i class="bi bi-mic" aria-hidden="true"></i>
            </button>

            <button class="player-icon" type="button" aria-label="Coda di riproduzione">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <button class="player-icon" type="button" aria-label="Dispositivi disponibili">
                <i class="bi bi-speaker" aria-hidden="true"></i>
            </button>

            <button class="player-icon" type="button" aria-label="Volume">
                <i class="bi bi-volume-up" aria-hidden="true"></i>
            </button>

            <div class="volume-bar" role="progressbar" aria-label="Livello del volume" aria-valuemin="0"
                aria-valuemax="100" aria-valuenow="70">
                <div class="volume-progress"></div>
            </div>
        </div>
    </footer>

    <script src="../js/utility.js"></script>
    <script src="../js/album.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
