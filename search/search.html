<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../assets/img/Spotify_logo-favicon.svg"/>
    <title>Sfoglia tutto | Spotify Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/search.css" />
  </head>

  <body>
    <header class="top-navbar" data-bs-theme="dark">
      <nav class="navbar-content" aria-label="Navigazione principale">
        <div class="navbar-left">
          <a href="../homepage/index.html" class="spotify-logo" aria-label="Vai alla homepage">
            <i class="bi bi-spotify" aria-hidden="true"></i>
          </a>
        </div>

        <div class="navbar-center">
          <a href="../homepage/index.html" class="home-button" aria-label="Vai alla homepage">
            <i class="bi bi-house-door-fill" aria-hidden="true"></i>
          </a>

          <div class="search-container">
            <i class="bi bi-search" aria-hidden="true"></i>

            <input type="search" id="search-input" name="search" placeholder="Cosa vuoi ascoltare?" aria-label="Cerca musica" autocomplete="off"/>

            <span class="search-divider"></span>

            <a href="./search.html" class="search-browse-button" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Sfoglia tutto" aria-label="Sfoglia tutto">
              <i class="bi bi-archive" aria-hidden="true"></i>
            </a>

          </div>
        </div>

        <div class="navbar-right">
          <button class="navbar-icon-button" type="button" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Novità" aria-label="Novità">
            <i class="bi bi-bell" aria-hidden="true"></i>
          </button>

          <button class="navbar-icon-button" type="button" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Attività di ascolto" aria-label="Attività di ascolto">
            <i class="bi bi-people" aria-hidden="true"></i>
          </button>

          <div class="dropdown">
            <button class="login-button" type="button" id="account-menu-button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
              Accedi
            </button>

            <div class="dropdown-menu dropdown-menu-end account-menu" aria-labelledby="account-menu-button">
              <a href="#" class="account-menu-item">
                <i class="bi bi-star" aria-hidden="true"></i> Premium
              </a>

              <a href="#" class="account-menu-item">
                <i class="bi bi-question-circle" aria-hidden="true"></i> Assistenza
              </a>

              <a href="#" class="account-menu-item">
                <i class="bi bi-download" aria-hidden="true"></i> Scarica
              </a>

              <div class="account-menu-divider"></div>

              <a href="#" class="account-menu-item">
                <i class="bi bi-person-plus" aria-hidden="true"></i> Iscriviti
              </a>
            </div>

          </div>
        </div>

        <button class="navbar-toggler navbar-menu-button" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Apri il menu di navigazione">
          <span class="navbar-toggler-icon"></span>
        </button>
      </nav>

      <div class="collapse navbar-menu" id="navbar-menu">
        <a href="#" class="navbar-menu-link">Premium</a>
        <a href="#" class="navbar-menu-link">Assistenza</a>
        <a href="#" class="navbar-menu-link">Scarica</a>

        <div class="navbar-menu-actions">
          <button class="signup-button" type="button">Iscriviti</button>
          <button class="login-button" type="button">Accedi</button>
        </div>

        <p class="navbar-menu-heading">La tua libreria</p>

        <a href="#" class="navbar-menu-link">
          <i class="bi bi-music-note-beamed" aria-hidden="true"></i> Brani che ti piacciono
        </a>

        <a href="#" class="navbar-menu-link">
          <i class="bi bi-person-fill" aria-hidden="true"></i> Artisti seguiti
        </a>

        <a href="#" class="navbar-menu-link">
          <i class="bi bi-disc-fill" aria-hidden="true"></i> Album salvati
        </a>
      </div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="La tua libreria"> <!-- Libreria laterale -->
        <div class="sidebar-header">
          <div class="sidebar-title">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Riduci o espandi la libreria">
              <span class="sidebar-toggle-icon">
                <span class="sidebar-toggle-arrow">&lsaquo;</span>
              </span>
            </button>

            <h2>La tua libreria</h2>
          </div>

          <button class="sidebar-add-button" type="button" aria-label="Aggiungi contenuto alla libreria">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
        </div>

        <div class="sidebar-actions">
          <button class="sidebar-pill" type="button">Playlist</button>
          <button class="sidebar-pill" type="button">Artisti</button>
          <button class="sidebar-pill" type="button">Album</button>
        </div>

        <div class="sidebar-search">
          <button class="sidebar-search-button" type="button" aria-label="Cerca nella libreria">
            <i class="bi bi-search" aria-hidden="true"></i>
          </button>

          <button class="sidebar-order-button" type="button">
            Recenti <i class="bi bi-list-ul" aria-hidden="true"></i>
          </button>
        </div>

        <div class="library-list">
          <article class="library-item">
            <div class="library-placeholder">
              <i class="bi bi-music-note-beamed" aria-hidden="true"></i>
            </div>

            <div class="library-item-info">
              <h3>Brani che ti piacciono</h3>
              <p>Playlist</p>
            </div>
          </article>

          <article class="library-item">
            <div class="library-placeholder">
              <i class="bi bi-person-fill" aria-hidden="true"></i>
            </div>

            <div class="library-item-info">
              <h3>Artisti seguiti</h3>
              <p>Artisti</p>
            </div>
          </article>

          <article class="library-item">

            <div class="library-placeholder">
              <i class="bi bi-disc-fill" aria-hidden="true"></i>
            </div>

            <div class="library-item-info">
              <h3>Album salvati</h3>
              <p>Album</p>
            </div>

          </article>

        </div>
      </aside>

      <main id="main-content" class="main-content">

        <section aria-labelledby="browse-title"> <!-- CATEGORIE-->
          <h1 id="browse-title" class="browse-title">Sfoglia tutto</h1>

          <div id="browse-grid" class="browse-grid">
            <!-- con search.js inserisce qui le tessere delle categorie -->
          </div>
        </section>

      </main>
    </div>

    <footer class="player-bar">

      <div class="player-left">
        <img src="https://placehold.co/56x56" alt="Copertina del brano in riproduzione" class="player-cover"/>

        <div class="player-song-info">
          <h4>Nome brano</h4>
          <p>Nome artista</p>
        </div>

        <button class="player-icon" type="button" aria-label="Aggiungi ai brani preferiti">
          <i class="bi bi-heart" aria-hidden="true"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="player-icon" type="button" aria-label="Riproduzione casuale">
            <i class="bi bi-shuffle" aria-hidden="true"></i>
          </button>

          <button class="player-icon" type="button" aria-label="Brano precedente">
            <i class="bi bi-skip-start-fill" aria-hidden="true"></i>
          </button>

          <button class="play-button" type="button" aria-label="Riproduci">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
          </button>

          <button class="player-icon" type="button" aria-label="Brano successivo">
            <i class="bi bi-skip-end-fill" aria-hidden="true"></i>
          </button>

          <button class="player-icon" type="button" aria-label="Ripeti">
            <i class="bi bi-repeat" aria-hidden="true"></i>
          </button>
        </div>

        <div class="player-progress">
          <span>0:00</span>

          <div class="progress-bar" role="progressbar" aria-label="Avanzamento del brano" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress">

            </div>
          </div>

          <span>3:45</span>
        </div>

      </div>

      <div class="player-right">
        <button class="player-icon" type="button" aria-label="Testo del brano">
          <i class="bi bi-mic" aria-hidden="true"></i>
        </button>

        <button class="player-icon" type="button" aria-label="Coda di riproduzione">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <button class="player-icon" type="button" aria-label="Dispositivi disponibili">
          <i class="bi bi-speaker" aria-hidden="true"></i>
        </button>

        <button class="player-icon" type="button" aria-label="Volume">
          <i class="bi bi-volume-up" aria-hidden="true"></i>
        </button>

        <div class="volume-bar" role="progressbar" aria-label="Livello del volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
          <div class="volume-progress"></div>
        </div>

      </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/search.js"></script>
  </body>
</html>
